<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>タイトル画面 夜テーマ サンプル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
/* タイトル画面を「夜」に寄せた背景・ボタンのサンプル（ゲームには読み込まれない）。
   上のタブで案を切り替え。気に入った案の CSS を css/game.css の「モード選択」へ移植する想定 */
:root{--serif:"Cinzel","Noto Serif JP","Yu Mincho",serif;--gold:#d6b25e;--gold-hi:#f6e3a1;--gold-lo:#8a6a26}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.6 "Noto Sans JP",system-ui,sans-serif;color:#eef2ff;background:#03060f;overflow:hidden}

/* 切り替えバー */
.bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;
  background:rgba(3,6,15,.85);border-bottom:1px solid #2a3557;backdrop-filter:blur(6px)}
.bar b{font-size:12px;color:#9db0dc;margin-right:4px}
.bar button{font:inherit;font-size:12.5px;color:#cfd8f5;background:#111a33;border:1px solid #2a3a66;border-radius:999px;padding:4px 12px;cursor:pointer}
.bar button.on{background:#d6b25e;color:#1a1206;border-color:#f6e3a1;font-weight:700}
.bar .sp{flex:1}
.bar .note{flex-basis:100%;font-size:11.5px;color:#8f9cc0;margin:0}

/* 舞台（ゲームの body + .mode に相当） */
/* 背景（.sky）はスクロールしない枠に固定し、中身だけ .scroll でスクロールさせる（ゲームでも背景は position:fixed の層にする） */
.scene{position:fixed;inset:76px 0 0 0;overflow:hidden;isolation:isolate}
.scroll{position:absolute;inset:0;overflow:auto}
.scene.phone{left:50%;width:390px;margin-left:-195px;border-left:1px solid #333;border-right:1px solid #333}
.sky{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sky>*{position:absolute}
.mode{max-width:820px;margin:0 auto;padding:22px 16px 40px;position:relative}
.title{text-align:center;margin-bottom:14px}
.title small{font:600 12px var(--serif);letter-spacing:.35em;color:#9db0dc;text-transform:uppercase}
.title h2{margin:2px 0 0;font:700 clamp(34px,7vw,58px)/1.1 var(--serif);letter-spacing:.14em;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.showcase{display:flex;justify-content:center;gap:8px;margin:0 auto 18px;flex-wrap:wrap}
.showtile{position:relative;width:78px;aspect-ratio:3/4;border-radius:4px;overflow:hidden;border:1px solid var(--gold)}
.showtile img{width:100%;height:100%;object-fit:cover;display:block}
.topmenu{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:22px}
.gbtn{position:relative;display:block;width:280px;max-width:100%;margin:0 auto;padding:15px 12px;text-align:center;font:500 17px var(--serif);letter-spacing:.18em;cursor:pointer;color:#f1e6c0;border:0;background:none}
.phone .gbtn{width:240px;padding:12px 10px;font-size:15px}
.phone .topmenu{gap:16px}

/* 星（JS が box-shadow で散らす。ゲームでも事前計算した box-shadow を貼れば同じ） */
.stars{left:0;top:0;width:1px;height:1px;border-radius:50%;background:transparent}
.stars.s1{animation:twinkle 4s ease-in-out infinite}
.stars.s2{animation:twinkle 6s 1.3s ease-in-out infinite}
.stars.s3{animation:twinkle 9s 2.1s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}

/* =====================================================================
   A. 星月夜 — 群青のグラデ＋三日月＋瞬く星。ボタンは「月光ガラス」
   ===================================================================== */
.vA .sky{background:
   radial-gradient(ellipse 120% 60% at 50% 110%,rgba(40,70,140,.45),transparent 60%),
   linear-gradient(180deg,#02040c 0%,#07112b 45%,#0f2050 80%,#1a2f66 100%)}
.vA .moon{top:9%;right:12%;width:90px;height:90px;border-radius:50%;
  box-shadow:inset -22px 10px 0 0 #f6ecc8,0 0 40px 6px rgba(246,236,200,.15);transform:rotate(-20deg);filter:drop-shadow(0 0 14px rgba(246,236,200,.55))}
.vA .haze{left:-10%;right:-10%;bottom:-6%;height:34%;background:radial-gradient(ellipse 50% 60% at 50% 100%,rgba(130,160,230,.18),transparent 70%)}
.vA .title h2{filter:drop-shadow(0 0 22px rgba(246,236,200,.35))}
.vA .showtile{border-color:rgba(214,178,94,.7);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.6),0 0 18px rgba(120,160,255,.12)}
.vA .gbtn{color:#e8eeff;border-radius:3px;
  background:linear-gradient(180deg,rgba(40,64,130,.42),rgba(10,20,52,.55));
  border:1px solid rgba(160,190,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(10,20,50,.6),0 6px 20px rgba(0,0,0,.45);
  backdrop-filter:blur(4px);overflow:hidden;transition:border-color .2s,box-shadow .2s,color .2s}
.vA .gbtn::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(246,236,200,.28),transparent);transition:left .6s}
.vA .gbtn:hover{border-color:rgba(246,236,200,.8);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 22px rgba(246,236,200,.25),0 6px 20px rgba(0,0,0,.45)}
.vA .gbtn:hover::after{left:120%}
.vA .gbtn.p{color:#1a1408;font-weight:700;border-color:#fff4cf;
  background:linear-gradient(180deg,#fff6d8,#ecd590 45%,#c9a650);
  box-shadow:0 0 0 1px rgba(0,0,0,.4),0 0 26px rgba(246,226,160,.45),0 6px 20px rgba(0,0,0,.45)}

/* =====================================================================
   B. 月下の魔法陣 — 大きな満月をタイトルの背に、ゆっくり回る魔法陣と霧。
      ボタンは「金の細線」だけのゴースト型、主ボタンは光る満月色
   ===================================================================== */
.vB .sky{background:
   radial-gradient(circle at 50% 22%,rgba(255,244,214,.10) 0,transparent 32%),
   linear-gradient(180deg,#05050f 0%,#0b0d24 50%,#12163a 100%)}
.vB .fullmoon{left:50%;top:40px;width:260px;height:260px;margin-left:-130px;border-radius:50%;
  background:radial-gradient(circle at 42% 40%,#fffaf0 0,#f3e7c6 35%,#d9c79a 62%,#b9a777 100%);
  box-shadow:0 0 60px 10px rgba(255,240,200,.35),0 0 180px 60px rgba(255,230,170,.12);opacity:.92}
.vB .fullmoon::before{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 30% 60%,rgba(150,130,90,.25) 0 9%,transparent 10%),radial-gradient(circle at 65% 35%,rgba(150,130,90,.2) 0 7%,transparent 8%),radial-gradient(circle at 58% 70%,rgba(150,130,90,.18) 0 12%,transparent 13%)}
.vB .circle{left:50%;top:-30px;width:560px;height:560px;margin-left:-280px;background:url(../img/ui/mcircle.webp) center/contain no-repeat;opacity:.13;
  animation:spin 120s linear infinite;mix-blend-mode:screen}
@keyframes spin{to{transform:rotate(360deg)}}
.vB .mist{left:-20%;right:-20%;bottom:0;height:45%;
  background:radial-gradient(ellipse 40% 40% at 25% 90%,rgba(170,180,230,.16),transparent 70%),radial-gradient(ellipse 45% 35% at 75% 95%,rgba(170,180,230,.14),transparent 70%);
  animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(6%)}}
.vB .title h2{background:linear-gradient(180deg,#3a2a0c,#1a1206);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 1px rgba(255,240,200,.9)) drop-shadow(0 0 12px rgba(255,240,200,.6))}
.vB .title small{color:#5a4a2a;text-shadow:0 0 8px rgba(255,240,200,.8)}
.vB .showcase{margin-top:40px}
.vB .showtile{border-color:rgba(255,240,200,.6);box-shadow:0 10px 30px rgba(0,0,0,.7)}
.vB .gbtn{color:#efe4c2;background:linear-gradient(90deg,transparent,rgba(8,10,28,.9) 20%,rgba(8,10,28,.9) 80%,transparent);
  transition:color .2s,letter-spacing .25s}
.vB .gbtn::before,.vB .gbtn::after{content:'';position:absolute;left:8%;right:8%;height:1px;
  background:linear-gradient(90deg,transparent,#d6b25e 30%,#f6e3a1 50%,#d6b25e 70%,transparent)}
.vB .gbtn::before{top:0}.vB .gbtn::after{bottom:0}
.vB .gbtn:hover{color:#fff;letter-spacing:.26em;text-shadow:0 0 12px rgba(255,240,200,.8)}
.vB .gbtn.p{color:#fffbe8;font-weight:700;text-shadow:0 0 10px rgba(255,230,160,.9),0 0 24px rgba(255,210,120,.6);
  background:radial-gradient(ellipse 60% 100% at 50% 50%,rgba(255,200,110,.28),transparent 70%),linear-gradient(90deg,transparent,rgba(8,10,28,.92) 20%,rgba(8,10,28,.92) 80%,transparent)}

/* ---- B' 月なし：満月を消し、タイトルの扱いを3通り（下の「タイトル」ボタンで切替） ---- */
.nomoon .fullmoon{display:none}
.nomoon .title{position:relative}
.nomoon .title::before{content:'';position:absolute;left:50%;top:50%;width:560px;max-width:120%;height:200px;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 50% 50% at 50% 55%,rgba(255,232,180,.13),transparent 70%)}
.nomoon .title small{color:#b8a985;text-shadow:0 0 8px rgba(0,0,0,.8)}
.nomoon .showcase{margin-top:26px}
/* 1. 金（今の色）＋淡い月光のにじみ */
.nomoon.tt1 .title h2{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 1px rgba(255,240,200,.5)) drop-shadow(0 0 20px rgba(255,220,150,.4))}
/* 2. 白銀（月光そのものの色） */
.nomoon.tt2 .title h2{background:linear-gradient(180deg,#ffffff,#e4e9f7 45%,#9aa6c8);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 1px rgba(220,230,255,.8)) drop-shadow(0 0 18px rgba(170,195,255,.45))}
.nomoon.tt2 .title small{color:#9db0dc}
.nomoon.tt2 .title::before{background:radial-gradient(ellipse 50% 50% at 50% 55%,rgba(170,195,255,.14),transparent 70%)}
/* 3. 金＋魔法陣をタイトルの真後ろに（月の代わりに魔法陣を主役に） */
.nomoon.tt3 .circle{top:-150px;width:520px;height:520px;margin-left:-260px;opacity:.22}
.nomoon.tt3 .title h2{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.9)) drop-shadow(0 0 16px rgba(255,220,150,.35))}
.nomoon.tt3 .title::before{background:radial-gradient(ellipse 50% 50% at 50% 55%,rgba(8,10,28,.7),transparent 70%)}
/* ---- 画像背景（img/ui/title-bg.webp / スマホ title-bg-sp.webp）。星・魔法陣・霧はCSSで上に重ねる ---- */
.bgimg .sky{background:#03060f url(../img/ui/title-bg.webp) center/cover no-repeat}
.bgimg.phone .sky{background-image:url(../img/ui/title-bg-sp.webp)}
@media (max-width:860px){.bgimg .sky{background-image:url(../img/ui/title-bg-sp.webp)}}
.bgimg .sky::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 55% at 50% 45%,rgba(3,6,15,.35),transparent 75%)}
.bgimg .stars.s1{opacity:.6}
.bar .tsel{display:none;gap:6px;align-items:center}
.bar .tsel.show{display:flex}

/* =====================================================================
   C. 流星群 — 深い紺〜紫にオーロラの帯と流れ星。
      ボタンは角を落とした「夜光」パネル（青い発光線）、主ボタンは金の発光
   ===================================================================== */
.vC .sky{background:linear-gradient(180deg,#010208 0%,#060a1e 40%,#140f33 75%,#24154a 100%)}
.vC .aurora{left:-20%;right:-20%;top:8%;height:46%;filter:blur(30px);opacity:.55;
  background:
    radial-gradient(ellipse 30% 40% at 20% 50%,rgba(60,220,180,.55),transparent 70%),
    radial-gradient(ellipse 28% 35% at 50% 40%,rgba(80,140,255,.5),transparent 70%),
    radial-gradient(ellipse 30% 40% at 80% 55%,rgba(170,90,255,.45),transparent 70%);
  animation:aur 18s ease-in-out infinite alternate}
@keyframes aur{to{transform:translateX(8%) skewX(-8deg);opacity:.35}}
.vC .meteor{width:140px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);
  transform:rotate(-30deg);opacity:0;animation:fall 7s linear infinite;filter:drop-shadow(0 0 6px #9cf)}
@keyframes fall{0%{opacity:0;translate:0 0}3%{opacity:1}12%{opacity:0;translate:-340px 196px}100%{opacity:0;translate:-340px 196px}}
.vC .title h2{filter:drop-shadow(0 0 16px rgba(120,180,255,.45))}
.vC .showtile{border-color:rgba(130,180,255,.55);box-shadow:0 0 14px rgba(90,150,255,.25),0 8px 22px rgba(0,0,0,.6)}
.vC .gbtn{--cut:12px;color:#d9e6ff;
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
  background:linear-gradient(180deg,rgba(16,30,80,.9),rgba(6,12,36,.95));
  box-shadow:inset 0 0 0 1px rgba(120,170,255,.45),inset 0 0 22px rgba(80,140,255,.18);transition:box-shadow .2s,color .2s}
.vC .gbtn::before{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#7fb6ff,transparent);opacity:.7}
.vC .gbtn:hover{color:#fff;box-shadow:inset 0 0 0 1px rgba(160,200,255,.9),inset 0 0 30px rgba(110,170,255,.35)}
.vC .gbtn.p{color:#1a1206;font-weight:700;background:linear-gradient(180deg,#ffe9a8,#e0b955 55%,#b58a2e);
  box-shadow:inset 0 0 0 1px #fff2c6,inset 0 0 18px rgba(255,255,255,.35)}
.vC .gbtn.p::before{background:linear-gradient(90deg,transparent,#fff,transparent)}
.vC .menuwrap{filter:drop-shadow(0 0 14px rgba(255,210,120,.0))}
.vC .topmenu .gbtn.p{filter:drop-shadow(0 0 12px rgba(255,210,120,.55))}

/* =====================================================================
   D. 紅い月の夜 — 冬木の夜景っぽい街のシルエットと赤い月。
      ボタンは斜めに切った「刃」型、赤のアクセント
   ===================================================================== */
.vD .sky{background:
   radial-gradient(ellipse 80% 50% at 50% 100%,rgba(120,20,40,.35),transparent 70%),
   linear-gradient(180deg,#050208 0%,#120816 45%,#2a0d1e 85%,#3a1220 100%)}
.vD .redmoon{top:9%;right:9%;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle at 40% 38%,#ffb3a0 0,#e0503c 45%,#8f1d1f 100%);
  box-shadow:0 0 50px 12px rgba(220,60,50,.35),0 0 140px 40px rgba(180,30,40,.18)}
.vD .city{left:0;right:0;bottom:0;height:150px;background:#06030a;
  clip-path:polygon(0 70%,4% 70%,4% 45%,9% 45%,9% 60%,13% 60%,13% 30%,15% 30%,15% 25%,17% 25%,17% 30%,19% 30%,19% 55%,24% 55%,24% 40%,29% 40%,29% 65%,33% 65%,33% 20%,36% 20%,36% 12%,37% 12%,37% 20%,40% 20%,40% 58%,45% 58%,45% 48%,50% 48%,50% 62%,55% 62%,55% 35%,60% 35%,60% 52%,64% 52%,64% 28%,66% 28%,66% 22%,68% 22%,68% 28%,70% 28%,70% 60%,75% 60%,75% 44%,80% 44%,80% 66%,85% 66%,85% 38%,90% 38%,90% 56%,95% 56%,95% 46%,100% 46%,100% 100%,0 100%)}
.vD .windows{left:0;right:0;bottom:0;height:150px;opacity:.7;
  background:radial-gradient(circle,#ffcf7a 0 1px,transparent 1.5px) 0 0/23px 17px;
  -webkit-mask:linear-gradient(transparent 35%,#000 60%);mask:linear-gradient(transparent 35%,#000 60%)}
.vD .title h2{background:linear-gradient(180deg,#fff0e6,#e9c6a0 50%,#b0603a);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 18px rgba(230,70,60,.45))}
.vD .title small{color:#c99}
.vD .showtile{border-color:#b84a4a;box-shadow:0 0 0 1px #000,0 8px 22px rgba(0,0,0,.7)}
.vD .gbtn{--sk:14px;color:#f2e6e6;
  clip-path:polygon(var(--sk) 0,100% 0,calc(100% - var(--sk)) 100%,0 100%);
  background:linear-gradient(90deg,#1a0c14,#2a1220 50%,#1a0c14);transition:transform .15s,color .2s}
.vD .gbtn::before{content:'';position:absolute;left:var(--sk);top:0;bottom:0;width:4px;background:#d23c3c;transform:skewX(-13deg);transform-origin:top}
.vD .gbtn::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(210,60,60,.0),rgba(210,60,60,.35));opacity:0;transition:opacity .2s}
.vD .gbtn:hover{transform:translateX(6px);color:#fff}
.vD .gbtn:hover::after{opacity:1}
.vD .gbtn.p{color:#fff;font-weight:700;background:linear-gradient(90deg,#8e1c22,#d23c3c 55%,#8e1c22);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.vD .gbtn.p::before{background:#ffd9a0}

/* =====================================================================
   E. 天の川 — 斜めに流れる天の川と星座線。
      ボタンは枠なしの文字＋左の星マーク、選ぶと星座線がのびる
   ===================================================================== */
.vE .sky{background:linear-gradient(170deg,#01020a 0%,#050b22 50%,#0a1636 100%)}
.vE .milky{left:-30%;right:-30%;top:15%;height:260px;transform:rotate(-22deg);filter:blur(18px);
  background:linear-gradient(180deg,transparent,rgba(160,170,230,.10) 25%,rgba(220,200,255,.22) 48%,rgba(255,220,200,.16) 55%,rgba(160,170,230,.10) 75%,transparent)}
.vE .milkydust{left:-30%;right:-30%;top:15%;height:260px;transform:rotate(-22deg);opacity:.8;
  background:radial-gradient(circle,rgba(255,255,255,.7) 0 .6px,transparent 1px) 0 0/7px 9px;
  -webkit-mask:linear-gradient(180deg,transparent 15%,#000 50%,transparent 85%);mask:linear-gradient(180deg,transparent 15%,#000 50%,transparent 85%)}
.vE .const{right:6%;top:58%;width:220px;height:140px;opacity:.55}
.vE .title h2{filter:drop-shadow(0 0 14px rgba(200,200,255,.35))}
.vE .showtile{border-radius:50%;width:72px;aspect-ratio:1;border:1px solid rgba(220,220,255,.6);box-shadow:0 0 14px rgba(180,190,255,.25)}
.vE .topmenu{align-items:center;gap:6px}
.vE .gbtn{width:260px;text-align:left;padding:12px 12px 12px 48px;color:#c9d2f2;letter-spacing:.2em;transition:color .2s}
.vE .gbtn::before{content:'';position:absolute;left:18px;top:50%;width:10px;height:10px;margin-top:-5px;background:#c9d2f2;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);transition:transform .3s,background .2s}
.vE .gbtn::after{content:'';position:absolute;left:48px;right:12px;bottom:6px;height:1px;background:linear-gradient(90deg,#f6e3a1,transparent);
  transform:scaleX(0);transform-origin:left;transition:transform .35s}
.vE .gbtn:hover{color:#fff}
.vE .gbtn:hover::before{transform:rotate(45deg) scale(1.5);background:#f6e3a1;filter:drop-shadow(0 0 4px #f6e3a1)}
.vE .gbtn:hover::after{transform:scaleX(1)}
.vE .gbtn.p{color:#f6e3a1;font-weight:700;font-size:20px}
.vE .gbtn.p::before{width:14px;height:14px;margin-top:-7px;left:16px;background:#f6e3a1;filter:drop-shadow(0 0 6px #f6e3a1)}
.vE .gbtn.p::after{transform:scaleX(1);opacity:.6}
.phone.vE .gbtn.p{font-size:17px}
</style></head>
<body>
<div class="bar">
  <b>夜テーマ案</b>
  <button data-v="A" class="on">A 星月夜</button>
  <button data-v="B">B 月下の魔法陣</button>
  <button data-v="F">B' 月なし</button>
  <button data-v="G">B' 画像背景</button>
  <button data-v="C">C 流星群</button>
  <button data-v="D">D 紅い月の夜</button>
  <button data-v="E">E 天の川</button>
  <span class="tsel" id="tsel"><b>タイトル</b><button data-t="1" class="on">1 金</button><button data-t="2">2 白銀</button><button data-t="3">3 魔法陣</button></span>
  <span class="sp"></span>
  <button id="phone">スマホ幅</button>
  <p class="note" id="note"></p>
</div>

<div class="scene vA" id="scene">
  <div class="sky" id="sky"></div>
  <div class="scroll"><div class="mode">
    <div class="title"><small>Fate fan-made pencil battle</small><h2>PENCIL DUEL</h2></div>
    <div class="showcase" id="show"></div>
    <div class="topmenu">
      <button class="gbtn p">クイックバトル</button>
      <button class="gbtn">ローカル対戦</button>
      <button class="gbtn">チュートリアル</button>
      <button class="gbtn">設定</button>
    </div>
  </div></div>
</div>

<script>
const NOTES={
  A:'群青グラデ＋三日月＋瞬く星。ボタンは半透明のガラス板に月光がすっと走る。今の雰囲気を残したまま一番自然に夜へ寄せる案',
  B:'タイトルの背に大きな満月、既存の魔法陣画像をゆっくり回転、足元に霧。ボタンは上下の金線だけのゴースト型で、文字が月光で光る',
  F:'Bから満月を外した版。タイトルは「1 金＋月光のにじみ」「2 白銀」「3 魔法陣をタイトルの真後ろに」の3通り',
  G:"B' 月なしの夜空を画像（img/ui/title-bg.webp、スマホ幅では title-bg-sp.webp）に置き換えた版。星の瞬き・魔法陣・霧はCSSのまま",
  C:'オーロラの帯と流れ星。ボタンは角を落とした発光パネル（青い光線）、主ボタンは金色に発光。一番ゲームUIっぽい',
  D:'赤い月と夜の街並みシルエット（窓の灯り）。ボタンは斜めに切った刃型で、ホバーで右へ滑り赤く染まる。一番Fateっぽい',
  E:'斜めの天の川と星座線。ボタンは枠なしの文字＋星マーク、ホバーで星が回って下に線が伸びる。一番静かで上品',
};
const FACES=['artoria','emiya','cu','heracles','hassan','kojiro'];
document.getElementById('show').innerHTML=FACES.map(id=>`<div class="showtile"><img src="../img/units/${id}.webp" alt=""></div>`).join('');

// 星の box-shadow（固定シードで毎回同じ配置）
let seed=7; const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
function starLayer(n,size,col){ const a=[]; for(let i=0;i<n;i++){ a.push(`${Math.round(r()*2000)}px ${Math.round(r()*1200)}px 0 ${size}px ${col}`);} return a.join(','); }
const STARS={
  s1:starLayer(120,0,'rgba(255,255,255,.8)'),
  s2:starLayer(60,.5,'rgba(220,230,255,.9)'),
  s3:starLayer(18,1,'rgba(255,245,210,1)'),
};
const stars=(k=['s1','s2','s3'])=>k.map(c=>`<div class="stars ${c}" style="box-shadow:${STARS[c]}"></div>`).join('');
const SKY={
  A:()=>stars()+'<div class="moon"></div><div class="haze"></div>',
  B:()=>stars(['s1','s2'])+'<div class="circle"></div><div class="fullmoon"></div><div class="mist"></div>',
  C:()=>stars()+'<div class="aurora"></div>'+[[70,8,0],[85,30,2.4],[55,4,4.6],[95,18,6]].map(([x,y,d])=>`<div class="meteor" style="left:${x}%;top:${y}%;animation-delay:${d}s"></div>`).join(''),
  D:()=>stars(['s1'])+'<div class="redmoon"></div><div class="windows"></div><div class="city"></div>',
  E:()=>stars()+'<div class="milky"></div><div class="milkydust"></div>'+
    `<svg class="const" viewBox="0 0 220 140"><g stroke="#cfd6ff" stroke-width=".8" fill="none"><polyline points="10,110 50,80 95,92 130,50 175,40 205,12"/><line x1="130" y1="50" x2="150" y2="105"/></g><g fill="#fff">${[[10,110],[50,80],[95,92],[130,50],[175,40],[205,12],[150,105]].map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${i%3?1.8:2.6}"/>`).join('')}</g></svg>`,
};
const scene=document.getElementById('scene'), sky=document.getElementById('sky'), note=document.getElementById('note');
let TT='1', CURV='A';
function setV(v){
  const cls=v==='F'?'vB nomoon tt'+TT:v==='G'?'vB nomoon bgimg tt'+TT:'v'+v;
  scene.className='scene '+cls+(scene.classList.contains('phone')?' phone':'');
  sky.innerHTML=SKY[v==='F'||v==='G'?'B':v]();
  document.getElementById('tsel').classList.toggle('show',v==='F'||v==='G'); CURV=v; note.textContent=NOTES[v];
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
}
document.querySelector('.bar').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='phone'){ scene.classList.toggle('phone'); b.classList.toggle('on'); return; }
  if(b.dataset.t){ TT=b.dataset.t; document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b)); setV(CURV==='G'?'G':'F'); return; }
  if(b.dataset.v) setV(b.dataset.v);
});
setV('A');
// 切り替えバーの高さ（折り返しで変わる）に合わせて舞台の上端をずらす
const fitTop=()=>{ scene.style.top=document.querySelector('.bar').offsetHeight+'px'; };
new ResizeObserver(fitTop).observe(document.querySelector('.bar')); fitTop();
</script>
</body></html>
