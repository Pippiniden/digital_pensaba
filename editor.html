<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pencil Editor</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+JP:wght@600;700;900&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="css/cutin.css">
<link rel="stylesheet" href="css/buttons.css">
</head>
<body>
<header>
  <h1>PENCIL EDITOR</h1><span id="status"></span>
  <span class="grow"></span>
  <button class="primary" data-act="apply">ゲームに反映</button>
  <button data-act="unapply" id="unapply" hidden>反映を解除</button>
  <button data-act="exportJS" id="exportJS">units.js を書き出し</button>
  <button data-act="exportJSON">JSON を書き出し</button>
  <button data-act="import">読み込み</button>
  <button data-act="resetDefault">標準データに戻す</button>
  <button data-act="simOpen" id="simbtn">バランス検証</button>
  <a class="btn" href="index.html">ゲームへ</a>
  <input type="file" id="file" accept=".json,.js,application/json,text/javascript" hidden>
  <input type="file" id="fileOne" accept=".json,.js,application/json,text/javascript" hidden>
</header>
<div class="ed">
  <aside id="list"></aside>
  <main id="form"></main>
  <section id="side"></section>
</div>
<dialog id="simdlg" aria-label="バランス検証"></dialog>
<dialog id="impdlg" aria-label="JSONの読み込み方法"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/rules.js"></script>
<script src="js/units.js"></script>
<script src="js/masters.js"></script>
<script src="js/common.js"></script>
<script src="js/cutin.js"></script>
<script src="js/editor.js"></script>
<script src="js/sim.js"></script>
<script src="js/editor-sim.js"></script>
</body>
</html>
