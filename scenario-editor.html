<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scenario Editor</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+JP:wght@600;700;900&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="css/scenario.css">
<link rel="stylesheet" href="css/scenario-editor.css">
<link rel="stylesheet" href="css/buttons.css">
</head>
<body>
<header>
  <h1>SCENARIO EDITOR</h1><span id="status"></span>
  <span class="grow"></span>
  <button class="primary" data-act="test" title="いまの内容をこのブラウザに保存して、ゲームで最初から遊びます">ゲームで試す</button>
  <button data-act="export">JSON を書き出し</button>
  <button data-act="import">読み込み</button>
  <button data-act="new">新規</button>
  <a class="btn" href="editor.html">ペンシルエディタ</a>
  <a class="btn" href="index.html">ゲームへ</a>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <input type="file" id="afile" hidden>
  <input type="file" id="ufile" accept=".json,.js,application/json,text/javascript" hidden>
</header>
<div class="ed">
  <aside id="list"></aside>
  <main id="form"></main>
  <section id="side"></section>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- 読み込み順：ルール → 標準データ → 共通処理 → CPU（強さの名前だけ使う）→ シナリオ共通 → エディタ -->
<script src="js/rules.js"></script>
<script src="js/units.js"></script>
<script src="js/masters.js"></script>
<script src="js/common.js"></script>
<script src="js/cpu.js"></script>
<script src="js/scenario-core.js"></script>
<script src="js/scenario-editor.js"></script>
</body>
</html>
